controller_manager:
  ros__parameters:
    update_rate: 1000  # <--- THE 1 kHz HARDWARE HEARTBEAT

    # 1. The Broadcasters: Read C++ memory and publish to ROS topics
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    imu_sensor_broadcaster:
      type: imu_sensor_broadcaster/IMUSensorBroadcaster

    contact_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    # 2. The Command Controller: Listens to Python and writes to C++ memory
    rl_forward_command_controller:
      type: forward_command_controller/ForwardCommandController

# -----------------------------------------------------------
# Controller Configurations
# -----------------------------------------------------------

joint_state_broadcaster:
  ros__parameters:
    joints:
      - joint_0
      - joint_1
      - joint_2
      - joint_3
      - joint_4
      - joint_5
      - joint_6
      - joint_7
      - joint_8
      - joint_9
    # Custom SEA state interfaces from ODrive S1 + AS5048A encoders
    interfaces:
      - after_spring_angle
      - load_encoder_position
      - torque_estimate

imu_sensor_broadcaster:
  ros__parameters:
    sensor_name: imu
    frame_id: imu_link

contact_state_broadcaster:
  ros__parameters:
    use_local_topics: true
    use_urdf_to_filter: false
    joints:
      - left_toe_switch
      - left_heel_switch
      - right_toe_switch
      - right_heel_switch
    interfaces:
      - contact

rl_forward_command_controller:
  ros__parameters:
    joints:
      - joint_0
      - joint_1
      - joint_2
      - joint_3
      - joint_4
      - joint_5
      - joint_6
      - joint_7
      - joint_8
      - joint_9
    # Custom SEA command interface
    interface_name: target_actuator_angle
